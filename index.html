/* ==========================================================================
   1. DESIGN TOKENS (Calm Academic + Luminous Modern SaaS)
   ========================================================================== */
:root {
  --bg-app: #f4f7fb;
  --bg-surface: rgba(255, 255, 255, 0.86);
  --bg-surface-solid: #ffffff;
  --bg-subtle: rgba(241, 245, 249, 0.85);
  --bg-muted: #e2e8f0;
  --bg-elevated: #ffffff;

  --ink-primary: #0f172a;
  --ink-secondary: #334155;
  --ink-muted: #64748b;
  --ink-on-accent: #ffffff;

  /* Luminous Mint/Teal Primary Accent */
  --accent: #0d9488;
  --accent-hover: #0f766e;
  --accent-glow: rgba(13, 148, 136, 0.42);
  --accent-soft: rgba(13, 148, 136, 0.11);
  --accent-border: rgba(13, 148, 136, 0.35);
  --accent-text: #0f766e;
  --spotlight: rgba(13, 148, 136, 0.13);

  /* Navy & Indigo Secondary Glow */
  --navy: #1e293b;
  --navy-soft: rgba(79, 70, 229, 0.08);

  /* Semantic Status Colors */
  --ok: #10b981;
  --ok-bg: rgba(16, 185, 129, 0.11);
  --ok-border: rgba(16, 185, 129, 0.45);
  --ok-glow: rgba(16, 185, 129, 0.35);

  --warn: #d97706;
  --warn-bg: rgba(245, 158, 11, 0.12);
  --warn-border: rgba(245, 158, 11, 0.45);

  --err: #f43f5e;
  --err-bg: rgba(244, 63, 94, 0.11);
  --err-border: rgba(244, 63, 94, 0.45);
  --err-glow: rgba(244, 63, 94, 0.32);

  --border: rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.15);
  --ring: rgba(13, 148, 136, 0.38);

  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 4px 16px -4px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  --shadow-md: 0 14px 34px -8px rgba(13, 148, 136, 0.14), 0 6px 16px -4px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.95);
  --shadow-modal: 0 24px 60px -12px rgba(15, 23, 42, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 24px;

  --font-sans: "Inter", system-ui, -apple-system, sans-serif;
  --font-serif: "Newsreader", Georgia, serif;
  --font-mono: "JetBrains Mono", monospace;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-silk: cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 262px;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg-app: #070b14;
  --bg-surface: rgba(17, 24, 39, 0.78);
  --bg-surface-solid: #111827;
  --bg-subtle: rgba(30, 41, 59, 0.75);
  --bg-muted: #334155;
  --bg-elevated: #1e293b;

  --ink-primary: #f8fafc;
  --ink-secondary: #cbd5e1;
  --ink-muted: #94a3b8;
  --ink-on-accent: #042f2e;

  --accent: #2dd4bf;
  --accent-hover: #5eead4;
  --accent-glow: rgba(45, 212, 191, 0.45);
  --accent-soft: rgba(45, 212, 191, 0.14);
  --accent-border: rgba(45, 212, 191, 0.38);
  --accent-text: #5eead4;
  --spotlight: rgba(45, 212, 191, 0.16);

  --navy: #e2e8f0;
  --navy-soft: rgba(99, 102, 241, 0.12);

  --ok: #34d399;
  --ok-bg: rgba(16, 185, 129, 0.15);
  --ok-border: rgba(52, 211, 153, 0.45);
  --ok-glow: rgba(52, 211, 153, 0.38);

  --warn: #fbbf24;
  --warn-bg: rgba(217, 119, 6, 0.16);
  --warn-border: rgba(251, 191, 36, 0.4);

  --err: #fb7185;
  --err-bg: rgba(244, 63, 94, 0.16);
  --err-border: rgba(251, 113, 133, 0.45);
  --err-glow: rgba(251, 113, 133, 0.35);

  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --ring: rgba(45, 212, 191, 0.45);

  --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 6px 20px -4px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  --shadow-md: 0 16px 38px -8px rgba(0, 0, 0, 0.65), 0 0 24px -6px rgba(45, 212, 191, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  --shadow-modal: 0 28px 70px rgba(0, 0, 0, 0.78), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  color-scheme: dark;
}

/* ==========================================================================
   2. RESET, AMBIENT AURORA & BASE TYPOGRAPHY
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html {
  background: var(--bg-app);
  color: var(--ink-primary);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}
::selection {
  background: var(--accent-soft);
  color: var(--ink-primary);
}
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  position: relative;
  background: var(--bg-app);
  transition: background-color 0.4s var(--ease-silk), color 0.4s var(--ease-silk);
}

/* Animated Floating Ambient Aurora Lights */
body::before, body::after {
  content: "";
  position: fixed;
  z-index: -1;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(70px);
  will-change: transform;
}
body::before {
  width: 58vmax;
  height: 58vmax;
  top: -22vmax;
  right: -14vmax;
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  animation: auroraFloat1 18s ease-in-out infinite alternate;
}
body::after {
  width: 52vmax;
  height: 52vmax;
  bottom: -20vmax;
  left: -12vmax;
  background: radial-gradient(circle, var(--navy-soft) 0%, transparent 70%);
  animation: auroraFloat2 22s ease-in-out infinite alternate;
}

@keyframes auroraFloat1 {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  100% { transform: translate3d(-5vmax, 4vmax, 0) scale(1.12); }
}
@keyframes auroraFloat2 {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  100% { transform: translate3d(5vmax, -4vmax, 0) scale(1.1); }
}

h1, h2, h3, h4 {
  margin: 0 0 0.5rem;
  color: var(--ink-primary);
  letter-spacing: -0.025em;
  line-height: 1.25;
}
h1 { font-size: clamp(1.7rem, 3.2vw, 2.25rem); font-weight: 800; }
h2 { font-size: 1.28rem; font-weight: 700; }
h3 { font-size: 1.06rem; font-weight: 600; }
p { margin: 0 0 1rem; color: var(--ink-secondary); max-width: 68ch; }
p:last-child { margin-bottom: 0; }
.text-muted { color: var(--ink-muted); font-size: 0.92rem; }
.text-xs { color: var(--ink-muted); font-size: 0.8125rem; }
.mono { font-family: var(--font-mono); font-size: 0.9em; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--ring);
}

/* ==========================================================================
   3. APPLICATION SHELL (Glass Sidebar + Main Stage + Mobile Bottom Nav)
   ========================================================================== */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* Sidebar Navigation */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--bg-surface);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-right: 1px solid var(--border);
  padding: 1.35rem 0.95rem;
  display: flex;
  flex-direction: column;
  gap: 1.3rem;
  z-index: 30;
  overflow-y: auto;
  box-shadow: var(--shadow-xs);
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.45rem 0.65rem;
  font-weight: 800;
  font-size: 1.18rem;
  color: var(--ink-primary);
  text-decoration: none;
  cursor: pointer;
  border-radius: var(--radius-md);
  transition: transform 0.3s var(--ease-spring), background-color 0.25s ease;
}
.brand:hover {
  background: var(--accent-soft);
  transform: translateX(2px);
}
.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-hover));
  color: var(--ink-on-accent);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  box-shadow: 0 6px 16px -4px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  transition: transform 0.45s var(--ease-spring), box-shadow 0.35s ease;
}
.brand:hover .brand-mark {
  transform: rotate(-10deg) scale(1.1);
  box-shadow: 0 8px 22px -2px var(--accent-glow);
}
.brand-mark svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.6; fill: none; }
.brand-badge {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 0.14rem 0.5rem;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--accent-text);
  border: 1px solid var(--accent-border);
  box-shadow: 0 0 12px -2px var(--accent-glow);
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: 0.28rem;
}
.nav-btn {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  padding: 0.64rem 0.85rem;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--ink-secondary);
  font-weight: 500;
  font-size: 0.93rem;
  text-align: left;
  cursor: pointer;
  transition: 
    background-color 0.25s var(--ease-out),
    color 0.25s var(--ease-out),
    transform 0.28s var(--ease-spring),
    border-color 0.25s ease,
    box-shadow 0.28s ease;
}
.nav-btn svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  flex-shrink: 0;
  opacity: 0.8;
  transition: transform 0.35s var(--ease-spring), opacity 0.25s ease;
}
.nav-btn:hover {
  background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), var(--spotlight), transparent 80%), var(--bg-subtle);
  color: var(--ink-primary);
  border-color: var(--accent-border);
  transform: translateX(4px);
}
.nav-btn:hover svg {
  transform: scale(1.16) rotate(-5deg);
  opacity: 1;
}
.nav-btn:active {
  transform: scale(0.97);
}
.nav-btn[aria-current="page"] {
  background: linear-gradient(90deg, var(--accent-soft), transparent 95%);
  color: var(--accent-text);
  border-color: var(--accent-border);
  font-weight: 700;
  box-shadow: 0 4px 16px -6px var(--accent-glow);
}
.nav-btn[aria-current="page"] svg {
  opacity: 1;
  filter: drop-shadow(0 0 6px var(--accent-glow));
}
.nav-btn[aria-current="page"]::before {
  content: "";
  position: absolute;
  left: 0;
  top: 20%;
  bottom: 20%;
  width: 4px;
  border-radius: 0 4px 4px 0;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: indicatorPop 0.35s var(--ease-spring) both;
}

@keyframes indicatorPop {
  from { transform: scaleY(0); }
  to { transform: scaleY(1); }
}

.nav-pill-count {
  margin-left: auto;
  font-size: 0.74rem;
  font-weight: 700;
  padding: 0.1rem 0.52rem;
  border-radius: 99px;
  background: var(--accent);
  color: var(--ink-on-accent);
  box-shadow: 0 0 12px var(--accent-glow);
  animation: pulseBadge 2.4s ease-in-out infinite;
}

@keyframes pulseBadge {
  0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
  50% { box-shadow: 0 0 0 6px rgba(13, 148, 136, 0); }
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}
.utility-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.45rem;
}
.lang-switch {
  display: inline-flex;
  background: var(--bg-subtle);
  padding: 3px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.lang-btn {
  border: 0;
  background: transparent;
  padding: 0.28rem 0.6rem;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink-muted);
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.25s var(--ease-spring);
}
.lang-btn[aria-pressed="true"] {
  background: var(--bg-surface-solid);
  color: var(--accent-text);
  box-shadow: var(--shadow-xs), 0 0 10px -2px var(--accent-glow);
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--ink-secondary);
  cursor: pointer;
  transition: all 0.3s var(--ease-spring);
}
.icon-btn:hover {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: var(--accent-text);
  transform: rotate(12deg) scale(1.08);
  box-shadow: 0 0 14px -2px var(--accent-glow);
}
.icon-btn svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; }

/* Main Content Area */
.main-wrap {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.mobile-topbar {
  display: none;
  position: sticky;
  top: 0;
  z-index: 25;
  background: var(--bg-surface);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
  padding: 0.65rem 1rem;
  align-items: center;
  justify-content: space-between;
}
.content-stage {
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  padding: 2.3rem 2.2rem 4rem;
  flex: 1;
}

/* ==========================================================================
   4. ULTRA-SMOOTH TWO-PHASE WINDOW TRANSITION ENGINE
   ========================================================================== */
.view-transition {
  will-change: opacity, transform, filter;
  transform-origin: top center;
}
.view-transition.stage-leave {
  opacity: 0;
  transform: translateY(10px) scale(0.988);
  filter: blur(5px);
  transition: opacity 0.16s var(--ease-silk), transform 0.16s var(--ease-silk), filter 0.16s var(--ease-silk);
  pointer-events: none;
}
.view-transition > * {
  animation: csRise 0.52s var(--ease-out) both;
}
.view-transition > *:nth-child(1) { animation-delay: 0.02s; }
.view-transition > *:nth-child(2) { animation-delay: 0.06s; }
.view-transition > *:nth-child(3) { animation-delay: 0.10s; }
.view-transition > *:nth-child(4) { animation-delay: 0.14s; }
.view-transition > *:nth-child(5) { animation-delay: 0.18s; }
.view-transition > *:nth-child(6) { animation-delay: 0.22s; }
.view-transition > *:nth-child(n+7) { animation-delay: 0.26s; }

.view-transition.still, .view-transition.still > * {
  animation: none !important;
}

@keyframes csRise {
  0% {
    opacity: 0;
    transform: translateY(18px) scale(0.985);
    filter: blur(4px);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes csPop {
  0% {
    opacity: 0;
    transform: translateY(12px) scale(0.96);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes csShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

.choice-list > *, .stack > .card, .grid-2 > *, .grid-3 > * {
  animation: csRise 0.52s var(--ease-out) both;
}
.choice-list > *:nth-child(1), .stack > .card:nth-child(1), .grid-2 > *:nth-child(1) { animation-delay: 0.04s; }
.choice-list > *:nth-child(2), .stack > .card:nth-child(2), .grid-2 > *:nth-child(2) { animation-delay: 0.09s; }
.choice-list > *:nth-child(3), .stack > .card:nth-child(3), .grid-2 > *:nth-child(3) { animation-delay: 0.14s; }
.choice-list > *:nth-child(4), .stack > .card:nth-child(4), .grid-2 > *:nth-child(4) { animation-delay: 0.19s; }
.stack > .card:nth-child(n+5) { animation-delay: 0.24s; }

.view-transition.still .choice-list > * { animation: none !important; }

/* Mobile Bottom Bar */
.mobile-bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 35;
  background: var(--bg-surface);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  border-top: 1px solid var(--border);
  padding: 0.35rem 0.5rem calc(env(safe-area-inset-bottom, 0px) + 0.35rem);
  justify-content: space-around;
}
.mob-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.18rem;
  padding: 0.35rem 0.2rem;
  border: 0;
  background: none;
  color: var(--ink-muted);
  font-size: 0.7rem;
  font-weight: 500;
  cursor: pointer;
  position: relative;
  transition: color 0.25s ease, transform 0.25s var(--ease-spring);
}
.mob-tab svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
.mob-tab[aria-current="page"] { color: var(--accent-text); font-weight: 700; }
.mob-tab[aria-current="page"] svg { filter: drop-shadow(0 0 6px var(--accent-glow)); animation: csPop 0.35s var(--ease-spring) both; }
.mob-tab:active { transform: scale(0.9); }
.mob-badge {
  position: absolute;
  top: 2px;
  right: calc(50% - 18px);
  background: var(--accent);
  color: var(--ink-on-accent);
  font-size: 0.65rem;
  font-weight: 700;
  padding: 0 5px;
  border-radius: 99px;
  box-shadow: 0 0 10px var(--accent-glow);
}

/* ==========================================================================
   5. LUMINOUS INTERACTIVE UI COMPONENTS (Cards, Buttons, Spotlight, Ripple)
   ========================================================================== */
.page-header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.75rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
  border-image: linear-gradient(90deg, var(--accent-border), transparent 75%) 1;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.76rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent-text);
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  padding: 0.22rem 0.68rem;
  border-radius: 99px;
  margin-bottom: 0.55rem;
  box-shadow: 0 0 14px -4px var(--accent-glow);
}

/* Buttons with Shimmer & Glow */
.btn {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.65rem 1.25rem;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 0.93rem;
  line-height: 1.3;
  cursor: pointer;
  text-decoration: none;
  transition: 
    transform 0.3s var(--ease-spring),
    box-shadow 0.3s var(--ease-out),
    background-color 0.22s ease,
    border-color 0.22s ease,
    color 0.22s ease;
}
.btn:hover:not(:disabled) {
  transform: translateY(-2.5px) scale(1.01);
}
.btn:active:not(:disabled) {
  transform: translateY(0) scale(0.96);
}
.btn:disabled { opacity: 0.55; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
  color: var(--ink-on-accent);
  box-shadow: 0 8px 20px -6px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
}
.btn-primary::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.35) 50%, transparent 75%);
  transform: translateX(-140%);
  transition: transform 0.75s var(--ease-out);
}
.btn-primary:hover:not(:disabled) {
  box-shadow: 0 12px 28px -4px var(--accent-glow), 0 0 0 3px var(--ring), inset 0 1px 0 rgba(255, 255, 255, 0.45);
}
.btn-primary:hover:not(:disabled)::after {
  transform: translateX(140%);
}

.btn-secondary {
  background: var(--bg-surface);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  color: var(--ink-primary);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-xs);
}
.btn-secondary:hover:not(:disabled) {
  background: radial-gradient(180px circle at var(--mx, 50%) var(--my, 50%), var(--spotlight), transparent 80%), var(--bg-surface-solid);
  border-color: var(--accent);
  color: var(--accent-text);
  box-shadow: 0 8px 22px -6px var(--accent-glow);
}

.btn-subtle {
  background: var(--bg-subtle);
  color: var(--ink-secondary);
}
.btn-subtle:hover:not(:disabled) {
  background: var(--accent-soft);
  color: var(--accent-text);
  border-color: var(--accent-border);
}

.btn-danger {
  background: var(--err-bg);
  color: var(--err);
  border-color: var(--err-border);
}
.btn-danger:hover:not(:disabled) {
  box-shadow: 0 8px 20px -6px var(--err-glow);
}

.btn-sm { padding: 0.44rem 0.85rem; font-size: 0.83rem; border-radius: var(--radius-sm); }
.btn-lg { padding: 0.82rem 1.55rem; font-size: 1rem; border-radius: var(--radius-md); }

/* Click Ripple Wave */
.cs-ripple {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  background: rgba(255, 255, 255, 0.45);
  pointer-events: none;
  animation: csRippleAnim 0.65s var(--ease-out) forwards;
}
.btn-secondary .cs-ripple, .btn-subtle .cs-ripple, .choice-btn .cs-ripple, .nav-btn .cs-ripple {
  background: var(--accent-border);
}
@keyframes csRippleAnim {
  to { transform: scale(3.4); opacity: 0; }
}

/* Interactive Cursor-Spotlight Cards */
.card {
  position: relative;
  overflow: hidden;
  background: radial-gradient(460px circle at var(--mx, -500px) var(--my, -500px), var(--spotlight), transparent 65%), var(--bg-surface);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.4rem 1.55rem;
  box-shadow: var(--shadow-sm);
  transition: 
    transform 0.35s var(--ease-spring),
    box-shadow 0.35s var(--ease-out),
    border-color 0.3s ease;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--accent-border);
}
.card-highlight {
  border-left: 4px solid var(--accent);
  background: radial-gradient(500px circle at var(--mx, 20%) var(--my, 20%), var(--spotlight), transparent 70%), linear-gradient(135deg, var(--accent-soft), transparent 60%), var(--bg-surface);
  box-shadow: var(--shadow-md);
}
.card-warn {
  border-left: 4px solid var(--warn);
  background: var(--warn-bg);
  border-color: var(--warn-border);
}

.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.15rem; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }
.stack { display: flex; flex-direction: column; gap: 1rem; }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: 0.65rem; }
.between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; }

/* Badges & Tags */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.22rem 0.65rem;
  border-radius: 99px;
  font-size: 0.76rem;
  font-weight: 600;
  background: var(--bg-subtle);
  color: var(--ink-secondary);
  border: 1px solid var(--border);
  transition: transform 0.25s var(--ease-spring), box-shadow 0.25s ease;
}
.badge:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-xs);
}
.badge-accent { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-border); }
.badge-ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.badge-warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.badge-err { background: var(--err-bg); color: var(--err); border-color: var(--err-border); }

/* Luminous Progress Bars */
.progress-track {
  width: 100%;
  height: 9px;
  background: var(--bg-subtle);
  border-radius: 99px;
  overflow: hidden;
  padding: 1px;
  border: 1px solid var(--border);
}
.progress-fill {
  position: relative;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-hover), var(--accent));
  background-size: 200% 100%;
  border-radius: 99px;
  box-shadow: 0 0 14px var(--accent-glow);
  transition: width 0.65s var(--ease-out);
  overflow: hidden;
}
.progress-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
  animation: barShimmer 2.2s infinite;
}
@keyframes barShimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}

/* Forms & Inputs */
.field { display: flex; flex-direction: column; gap: 0.35rem; }
.field label { font-size: 0.85rem; font-weight: 600; color: var(--ink-secondary); }
.input, select.input, textarea.input {
  padding: 0.62rem 0.9rem;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--ink-primary);
  font-size: 0.93rem;
  transition: border-color 0.22s ease, box-shadow 0.25s var(--ease-out), background-color 0.22s ease, transform 0.2s ease;
}
.input:hover {
  border-color: var(--accent-border);
}
.input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-surface-solid);
  box-shadow: 0 0 0 4px var(--ring), 0 4px 14px -4px var(--accent-glow);
  transform: translateY(-1px);
}

/* Question & Interactive Choice Buttons */
.stimulus-box {
  font-family: var(--font-serif);
  font-size: 1.08rem;
  line-height: 1.78;
  background: linear-gradient(135deg, var(--accent-soft) 0%, transparent 75%), var(--bg-subtle);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  padding: 1.2rem 1.4rem;
  border-radius: var(--radius-md);
  margin-bottom: 1.25rem;
  color: var(--ink-primary);
  box-shadow: var(--shadow-xs);
  transition: box-shadow 0.3s ease, border-color 0.3s ease;
}
.stimulus-box:hover {
  box-shadow: var(--shadow-sm);
}
.question-prompt {
  font-size: 1.16rem;
  font-weight: 700;
  color: var(--ink-primary);
  margin-bottom: 1.15rem;
  line-height: 1.5;
}
.choice-list {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  margin-bottom: 1.25rem;
}
.choice-btn {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-start;
  gap: 0.9rem;
  width: 100%;
  text-align: left;
  padding: 0.9rem 1.1rem;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border);
  background: radial-gradient(320px circle at var(--mx, -400px) var(--my, -400px), var(--spotlight), transparent 70%), var(--bg-surface);
  cursor: pointer;
  box-shadow: var(--shadow-xs);
  transition: 
    transform 0.32s var(--ease-spring),
    border-color 0.22s ease,
    background-color 0.22s ease,
    box-shadow 0.28s var(--ease-out);
}
.choice-btn:hover:not(:disabled) {
  border-color: var(--accent);
  transform: translateX(6px) translateY(-1px);
  box-shadow: 0 8px 24px -8px var(--accent-glow);
}
.choice-btn:active:not(:disabled) {
  transform: scale(0.985);
}
.choice-key {
  width: 29px;
  height: 29px;
  border-radius: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-strong);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--ink-secondary);
  flex-shrink: 0;
  margin-top: 1px;
  transition: transform 0.35s var(--ease-spring), background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease, box-shadow 0.25s ease;
}
.choice-btn:hover:not(:disabled) .choice-key {
  transform: scale(1.12) rotate(-4deg);
  border-color: var(--accent);
  color: var(--accent-text);
}
.choice-btn.selected {
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--accent-soft), transparent 85%), var(--bg-surface-solid);
  box-shadow: 0 0 0 3px var(--ring), 0 10px 26px -8px var(--accent-glow);
  transform: translateX(4px);
}
.choice-btn.selected .choice-key {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--ink-on-accent);
  transform: scale(1.12) rotate(-4deg);
  box-shadow: 0 4px 12px -2px var(--accent-glow);
}
.choice-btn.correct {
  border-color: var(--ok);
  background: linear-gradient(135deg, var(--ok-bg), transparent 85%), var(--bg-surface-solid);
  box-shadow: 0 0 0 3px var(--ok-bg), 0 10px 26px -6px var(--ok-glow);
  animation: springSuccess 0.5s var(--ease-spring);
}
.choice-btn.correct .choice-key {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
  box-shadow: 0 0 14px var(--ok-glow);
}
.choice-btn.wrong {
  border-color: var(--err);
  background: linear-gradient(135deg, var(--err-bg), transparent 85%), var(--bg-surface-solid);
  box-shadow: 0 0 0 3px var(--err-bg), 0 10px 26px -6px var(--err-glow);
  animation: csShake 0.45s ease;
}
.choice-btn.wrong .choice-key {
  background: var(--err);
  border-color: var(--err);
  color: #fff;
}

@keyframes springSuccess {
  0% { transform: scale(0.97); }
  50% { transform: scale(1.022); }
  100% { transform: scale(1); }
}

.feedback-banner {
  padding: 1.15rem 1.35rem;
  border-radius: var(--radius-md);
  margin: 1.1rem 0;
  border: 1.5px solid var(--border);
  animation: csPop 0.42s var(--ease-spring) both;
}
.feedback-banner.ok {
  background: var(--ok-bg);
  border-color: var(--ok-border);
  color: var(--ink-primary);
  box-shadow: 0 10px 28px -8px var(--ok-glow);
}
.feedback-banner.err {
  background: var(--err-bg);
  border-color: var(--err-border);
  color: var(--ink-primary);
  box-shadow: 0 10px 28px -8px var(--err-glow);
}

/* Tables */
.data-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.92rem;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-xs);
}
.data-table th, .data-table td {
  padding: 0.8rem 1rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.data-table tr:last-child td { border-bottom: 0; }
.data-table th {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ink-muted);
  background: var(--bg-subtle);
}
.data-table tbody tr { transition: background-color 0.2s ease; }
.data-table tbody tr:hover { background: var(--accent-soft); }

/* Smooth Modal Dialog */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.52);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 1rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s var(--ease-silk);
}
.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-box {
  background: var(--bg-surface-solid);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-modal), 0 0 40px -10px var(--accent-glow);
  width: min(100%, 560px);
  max-height: 90vh;
  overflow-y: auto;
  padding: 1.7rem;
  transform: translateY(18px) scale(0.95);
  transition: transform 0.38s var(--ease-spring);
}
.modal-backdrop.open .modal-box {
  transform: translateY(0) scale(1);
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 99px;
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
  background-clip: content-box;
}

.theme-anim, .theme-anim * {
  transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease !important;
}

/* Responsive Breakpoints */
@media (max-width: 860px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .mobile-topbar { display: flex; }
  .mobile-bottom-nav { display: flex; }
  .content-stage { padding: 1.25rem 1rem 5.5rem; }
}
/* image logo + hero */
.brand-mark{background:none!important;box-shadow:0 6px 16px -6px var(--accent-glow);overflow:hidden;border-radius:10px}
.brand-mark img{width:100%;height:100%;display:block}
.hero-art{margin:0 0 1.6rem;max-width:880px;border-radius:20px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-md);background:#0b1220}
.hero-art img{display:block;width:100%;height:auto;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.hero-art:hover img{transform:scale(1.035)}
@media (max-width:860px){.hero-art{border-radius:14px;margin-bottom:1.2rem}}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.5rem;align-items:center;margin-bottom:1.8rem}
.hero-grid .hero-art{margin:0;max-width:none;box-shadow:0 22px 50px -24px var(--accent-glow),var(--shadow-md)}
.hero-grid>.card{margin:0}
.hero-side>.cluster{margin-bottom:.5rem}
@media (max-width:1000px){.hero-grid{grid-template-columns:1fr}}
.mob-actions{flex-wrap:nowrap;gap:.35rem;align-items:center}
#mob-acct{white-space:nowrap;flex-shrink:0;min-width:2.2rem;border-radius:999px}
@media (max-width:380px){.mobile-topbar .brand>span:last-child{display:none}}
</style>

<body>

<div class="app-shell">
  <!-- DESKTOP SIDEBAR -->

/* ==========================================================================
   INTERACTIVE CURSOR SPOTLIGHT & TACTILE RIPPLE ENGINE
   ========================================================================== */
document.addEventListener("pointermove", e => {
  const el = e.target.closest(".card, .choice-btn, .nav-btn, .btn-secondary");
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--mx", (e.clientX - r.left) + "px");
  el.style.setProperty("--my", (e.clientY - r.top) + "px");
}, { passive: true });

document.addEventListener("pointerdown", e => {
  const btn = e.target.closest(".btn, .choice-btn, .nav-btn");
  if (!btn || btn.disabled) return;
  const r = btn.getBoundingClientRect();
  const sz = Math.max(r.width, r.height);
  const w = document.createElement("span");
  w.className = "cs-ripple";
  w.style.width = w.style.height = sz + "px";
  w.style.left = (e.clientX - r.left - sz / 2) + "px";
  w.style.top = (e.clientY - r.top - sz / 2) + "px";
  btn.appendChild(w);
  setTimeout(() => w.remove(), 660);
});

  {id:107,section:"MATH",unitId:"u-data",domain:"Problem-Solving and Data Analysis",skill:"Ratios, Percentages & Statistics",difficulty:"Easy",type:"mc",q:"A jacket costs $40. Its price rises by 25%, then falls by 20%. What is the final price?",o:["$36","$38","$40","$42"],c:2,e:"Multiply by the factors: 40 × 1.25 = 50, then 50 × 0.80 = 40. The two changes use different bases, so they do not simply cancel as 25 − 20.",e_ru:"Умножаем на множители: 40 × 1.25 = 50, затем 50 × 0.80 = 40. Базы у изменений разные.",t:"Successive percent changes multiply; they do not add.",t_ru:"Последовательные изменения в процентах перемножаются, а не складываются."},

{id:113,section:"RW",unitId:"u-info",domain:"Information and Ideas",skill:"Inferences",difficulty:"Medium",type:"mc",p:"In a study, bees were trained to link lemon scent with sugar water. When the sugar was removed, most bees still visited lemon-scented flowers for several days. This suggests that the bees' behavior",q:"Which choice most logically completes the text?",o:["was a learned association that did not disappear immediately", "depended entirely on the presence of sugar", "shows that bees cannot tell scents apart", "proves that bees prefer lemon to every other scent"],c:0,e:"The bees kept visiting lemon-scented flowers after the sugar was gone, so the link they learned lasted for a while. B contradicts the result. C is not supported: they clearly told lemon apart. D overreaches: only lemon was tested.",e_ru:"Пчёлы продолжали лететь на запах лимона и без сахара, значит выученная связь сохранялась. B противоречит результату, C не следует из текста, D — слишком сильный вывод: проверяли только лимон.",t:"A valid inference stays close to the evidence and does not overreach.",t_ru:"Верный вывод опирается на данные и не выходит за их пределы.",reviewed:false},
{id:114,section:"RW",unitId:"u-info",domain:"Information and Ideas",skill:"Main idea",difficulty:"Easy",type:"mc",p:"Urban rooftop gardens do more than supply vegetables. They lower building temperatures by shading roofs, absorb rainwater that would otherwise overload drains, and give residents a shared space to meet. Cities that treat them as decoration miss most of what they offer.",q:"Which choice best states the main idea of the text?",o:["Rooftop gardens offer several benefits beyond growing food.", "Rooftop gardens are mainly decorative.", "Rooftop gardens overload city drains.", "Vegetables grow poorly on rooftops."],c:0,e:"The text lists cooling, rainwater absorption and a shared space, then says treating gardens as decoration misses most of their value. A covers all of this. B is the view the text criticizes; C reverses the drainage point; D is never claimed.",e_ru:"В тексте перечислены охлаждение, поглощение дождевой воды и общее пространство. Вариант A охватывает всё. B — позиция, которую текст критикует, C искажает мысль о дренаже, D не упоминается.",t:"The main idea covers the whole text, not just one detail.",t_ru:"Главная мысль охватывает весь текст, а не одну деталь.",reviewed:false},
{id:115,section:"RW",unitId:"u-craft",domain:"Craft and Structure",skill:"Text structure",difficulty:"Medium",type:"mc",p:"Dr. Lena Ortiz spent a decade documenting how coral reefs recover after storms. She found that reefs with diverse fish populations regrew faster than those dominated by a single species. Her results suggest that protecting biodiversity may be a practical way to strengthen reef resilience.",q:"What is the main function of the final sentence?",o:["It interprets the finding as a possible conservation strategy.", "It casts doubt on the study's methods.", "It introduces an unrelated topic.", "It repeats the first sentence."],c:0,e:"The last sentence moves from the result (diverse reefs regrew faster) to what it might mean for practice. B and C have no basis in the text; D is wrong because the first sentence describes the research, not its implication.",e_ru:"Последнее предложение переходит от результата к возможному практическому выводу. B и C ничем не подтверждены, а первое предложение описывает исследование, а не вывод.",t:"Ask what a sentence does (describes, explains, concludes), not only what it says.",t_ru:"Спрашивайте, что делает предложение (описывает, объясняет, делает вывод), а не только о чём оно.",reviewed:false},
{id:116,section:"RW",unitId:"u-trans",domain:"Expression of Ideas",skill:"Transitions",difficulty:"Easy",type:"mc",p:"The museum replaced its printed labels with touch screens. ____ visitors now spend longer at each display.",q:"Which choice completes the text with the most logical transition?",o:["For instance,", "As a result,", "Nevertheless,", "Meanwhile,"],c:1,e:"Replacing labels with touch screens is the cause; visitors staying longer is the effect, so 'As a result' fits. 'Nevertheless' signals contrast, 'For instance' an example, 'Meanwhile' a simultaneous but unrelated event.",e_ru:"Замена подписей экранами — причина, а то, что посетители дольше задерживаются, — следствие, поэтому подходит «As a result». Остальные связки обозначают контраст, пример или параллельное событие.",t:"Name the relationship (cause, contrast, example) before choosing the transition.",t_ru:"Сначала определите связь (причина, контраст, пример), потом выбирайте слово.",reviewed:false},
{id:117,section:"RW",unitId:"u-bounds",domain:"Standard English Conventions",skill:"Sentence boundaries",difficulty:"Medium",type:"mc",p:"The festival offers workshops in painting, pottery, and weaving__ they may join only two per day.",q:"Which choice completes the text so that it conforms to Standard English?",o:["weaving, participants", "weaving; participants", "weaving participants", "weaving, so, participants"],c:1,e:"Both parts are complete sentences, so they need a semicolon (or a period). A is a comma splice, C a run-on, D misuses commas around 'so'.",e_ru:"Обе части — самостоятельные предложения, поэтому нужна точка с запятой. A — запятая вместо границы, C — слитное предложение, D — лишние запятые.",t:"Two independent clauses need a period, a semicolon, or a comma plus a conjunction.",t_ru:"Два самостоятельных предложения разделяют точкой, точкой с запятой или запятой с союзом.",reviewed:false},
{id:118,section:"RW",unitId:"u-form",domain:"Standard English Conventions",skill:"Subject-verb agreement",difficulty:"Medium",type:"mc",p:"The collection of rare maps, donated by three local families, ___ displayed on the second floor.",q:"Which choice completes the text so that it conforms to Standard English?",o:["are", "is", "were", "have been"],c:1,e:"The subject is 'collection' (singular), not 'maps' or 'families'. The present singular verb is 'is'. The others are plural or the wrong tense.",e_ru:"Подлежащее — «collection» (единственное число), а не «maps». Нужен глагол «is». Остальные формы множественные или другого времени.",t:"Find the true subject; ignore phrases set off between commas.",t_ru:"Найдите настоящее подлежащее и не обращайте внимания на вставку между запятыми.",reviewed:false},
{id:119,section:"MATH",unitId:"u-alg",domain:"Algebra",skill:"Linear equations & Systems",difficulty:"Easy",type:"mc",q:"A line passes through (0, 4) and (2, 10). What is its slope?",o:["2", "3", "5", "6"],c:1,e:"Slope = change in y / change in x = (10 − 4)/(2 − 0) = 3. A is the x-change only, C is 10/2, D is the y-change only.",e_ru:"Наклон = (10 − 4)/(2 − 0) = 3. A — только изменение x, C — 10/2, D — только изменение y.",t:"Slope is rise over run: (y₂ − y₁)/(x₂ − x₁).",t_ru:"Наклон — это приращение y, делённое на приращение x.",reviewed:false},
{id:120,section:"MATH",unitId:"u-alg",domain:"Algebra",skill:"Linear equations & Systems",difficulty:"Medium",type:"spr",q:"If 3(x − 2) = 2x + 5, what is x? (Enter a number)",ans:["11"],e:"Expand: 3x − 6 = 2x + 5. Subtract 2x: x − 6 = 5. Add 6: x = 11. Check: 3(9) = 27 and 2(11) + 5 = 27.",e_ru:"Раскрываем скобки: 3x − 6 = 2x + 5, значит x = 11. Проверка: 3·9 = 27 и 2·11 + 5 = 27.",t:"Expand, collect x on one side, then check by substitution.",t_ru:"Раскройте скобки, соберите x в одной части и проверьте подстановкой.",reviewed:false},
{id:121,section:"MATH",unitId:"u-alg",domain:"Algebra",skill:"Linear equations & Systems",difficulty:"Hard",type:"mc",q:"How many solutions does 4x + 6 = 2(2x + 3) have?",o:["No solution", "Exactly one", "Exactly two", "Infinitely many"],c:3,e:"The right side expands to 4x + 6, so both sides are identical and every x works. 'No solution' would need different constants; 'exactly one' needs different x-coefficients.",e_ru:"Правая часть равна 4x + 6, обе части совпадают, поэтому подходит любое x. Без решений было бы при разных константах, одно решение — при разных коэффициентах.",t:"Same slope and same intercept: infinitely many solutions.",t_ru:"Одинаковый наклон и свободный член дают бесконечно много решений.",reviewed:false},
{id:122,section:"MATH",unitId:"u-adv",domain:"Advanced Math",skill:"Quadratics & Exponential functions",difficulty:"Medium",type:"mc",q:"What is the sum of the solutions of x² − 5x + 6 = 0?",o:["5", "6", "−5", "1"],c:0,e:"Factor: (x − 2)(x − 3) = 0, so x = 2 or 3, and the sum is 5. B is the product, C has the wrong sign, D is the difference.",e_ru:"Раскладываем: (x − 2)(x − 3) = 0, корни 2 и 3, сумма 5. B — произведение, C — неверный знак, D — разность.",t:"For x² + bx + c = 0 the roots sum to −b.",t_ru:"Для x² + bx + c = 0 сумма корней равна −b.",reviewed:false},
{id:123,section:"MATH",unitId:"u-adv",domain:"Advanced Math",skill:"Quadratics & Exponential functions",difficulty:"Hard",type:"spr",q:"If f(x) = 2^x + 3, what is f(4) − f(1)? (Enter a number)",ans:["14"],e:"f(4) = 16 + 3 = 19 and f(1) = 2 + 3 = 5, so the difference is 14. The constant 3 cancels.",e_ru:"f(4) = 16 + 3 = 19, f(1) = 2 + 3 = 5, разность 14. Константа 3 сокращается.",t:"Evaluate each value separately, then subtract.",t_ru:"Вычислите значения отдельно и потом вычтите.",reviewed:false},
{id:124,section:"MATH",unitId:"u-data",domain:"Problem-Solving and Data Analysis",skill:"Ratios, Percentages & Statistics",difficulty:"Medium",type:"mc",q:"A bag has 4 red, 6 blue and 5 green marbles. One marble is chosen at random. What is the probability it is not blue?",o:["2/5", "3/5", "4/15", "9/10"],c:1,e:"There are 15 marbles and 9 are not blue, so 9/15 = 3/5. A is the probability of blue, C counts only red, D uses the wrong denominator.",e_ru:"Всего 15 шаров, не синих 9: 9/15 = 3/5. A — вероятность синего, C — только красные, D — неверный знаменатель.",t:"P(not A) = 1 − P(A); count outcomes carefully.",t_ru:"P(не A) = 1 − P(A); аккуратно считайте исходы.",reviewed:false},
{id:125,section:"MATH",unitId:"u-data",domain:"Problem-Solving and Data Analysis",skill:"Ratios, Percentages & Statistics",difficulty:"Medium",type:"spr",q:"A car travels 150 miles on 5 gallons of fuel. At the same rate, how many gallons are needed for 330 miles? (Enter a number)",ans:["11"],e:"The rate is 150/5 = 30 miles per gallon, so 330 miles need 330/30 = 11 gallons.",e_ru:"Расход: 150/5 = 30 миль на галлон, значит на 330 миль нужно 330/30 = 11 галлонов.",t:"Find the unit rate first, then scale.",t_ru:"Сначала найдите единичную ставку, потом масштабируйте.",reviewed:false},
{id:126,section:"MATH",unitId:"u-geom",domain:"Geometry and Trigonometry",skill:"Triangles, Circles & Area/Volume",difficulty:"Medium",type:"mc",q:"Triangle ABC is similar to triangle DEF, with AB = 6, DE = 9 and BC = 8. What is EF?",o:["10", "11", "12", "18"],c:2,e:"The scale factor is 9/6 = 1.5, so EF = 8 × 1.5 = 12. B adds 3 instead of multiplying; D doubles 9.",e_ru:"Коэффициент подобия 9/6 = 1,5, значит EF = 8 × 1,5 = 12. B — прибавление вместо умножения, D — удвоение 9.",t:"Similar figures scale by a constant factor (multiply, not add).",t_ru:"Подобные фигуры связаны постоянным множителем (умножение, а не сложение).",reviewed:false}
);

{id:127,section:"RW",unitId:"u-info",domain:"Information and Ideas",skill:"Evidence",difficulty:"Medium",type:"mc",p:"A student claims that urban trees reduce summer temperatures on city streets.",q:"Which finding, if true, most directly supports the student's claim?",o:["Streets lined with trees were on average 3°C cooler in summer than similar streets without trees.", "Many cities plant new trees every spring.", "Trees absorb carbon dioxide from the air.", "Residents enjoy walking beneath trees."],c:0,e:"The claim is about street temperature. Only A reports a temperature difference tied to trees. B, C and D may be true but say nothing about temperature.",e_ru:"Утверждение о температуре улиц. Только A сообщает о разнице температур из-за деревьев. B, C и D могут быть верны, но о температуре не говорят.",t:"Evidence must address the exact claim, not just the same topic.",t_ru:"Доказательство должно относиться именно к утверждению, а не просто к теме.",reviewed:false},
{id:128,section:"RW",unitId:"u-craft",domain:"Craft and Structure",skill:"Words in context",difficulty:"Medium",type:"mc",p:"The author's account of the negotiation was ______; it included every detail, even those that made her own role look less impressive.",q:"Which choice completes the text with the most logical and precise word?",o:["candid", "vague", "hostile", "ornate"],c:0,e:"She included every detail, even unflattering ones, which means she was frank: 'candid'. 'Vague' is the opposite, and nothing suggests hostility or elaborate decoration.",e_ru:"Она включила все детали, даже невыгодные, то есть была откровенна: «candid». «Vague» — противоположность, а враждебности или украшательства в тексте нет.",t:"Use the clues in the sentence to predict the word before reading the options.",t_ru:"Предскажите слово по подсказкам в предложении до просмотра вариантов.",reviewed:false},

(function(){
const KEY="clearstep2",DAY=864e5,INT=[1,3,7,14],Q=QUESTION_BANK,$=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lang="en",view="home",arg=null,R=null,storeOk=true,_navTimer=null;
try{lang=localStorage.getItem("cs2_lang")==="ru"?"ru":"en"}catch(e){}
const T=(a,b)=>lang==="ru"?b:a,L=o=>o&&(o[lang]||o.en);
const UNITS=COURSES.flatMap(c=>c.units.map(u=>Object.assign({course:c},u)));
const SK=[...new Set(Q.map(q=>q.skill))],DOM=[...new Set(Q.map(q=>q.domain))];
const qid=id=>Q.find(q=>q.id===id),unitOf=id=>UNITS.find(u=>u.id===id);
const blank=()=>({v:2,goal:10,upd:0,prof:null,a:[],m:{},lc:{},d:{},last:null});
let S=blank();
const okObj=x=>x&&typeof x==="object"&&!Array.isArray(x);
function clean(x){
  if(!okObj(x)||x.v!==2||!Array.isArray(x.a)||!okObj(x.m)||!okObj(x.lc)||!okObj(x.d))return null;
  const a=x.a.filter(t=>okObj(t)&&Number.isInteger(t.id)&&qid(t.id)&&Number.isFinite(t.ts)&&typeof t.ok==="boolean").map(t=>({id:t.id,ts:t.ts,sel:typeof t.sel==="number"?t.sel:String(t.sel==null?"":t.sel).slice(0,40),ok:t.ok,mode:String(t.mode||"practice"),first:!!t.first}));
  const m={};
  for(const k in x.m){const e=x.m[k];if(!qid(+k)||!okObj(e))continue;
    m[k]={stage:Math.min(4,Math.max(0,e.stage|0)),fails:Math.max(0,e.fails|0),note:String(e.note||"").slice(0,500),flag:!!e.flag,due:Number.isFinite(e.due)?e.due:null,done:!!e.done,why:["care","rule","read"].includes(e.why)?e.why:null,lastWrong:e.lastWrong==null?null:(typeof e.lastWrong==="number"?e.lastWrong:String(e.lastWrong).slice(0,40))}}
  const lc={};for(const k in x.lc)if(unitOf(k)&&Number.isFinite(x.lc[k]))lc[k]=x.lc[k];
  const d={};for(const k in x.d)if((k==="RW"||k==="MATH")&&Number.isFinite(x.d[k]))d[k]=x.d[k];
  const p=okObj(x.prof)?{goal:String(x.prof.goal||"").slice(0,30),level:String(x.prof.level||"").slice(0,30),date:String(x.prof.date||"").slice(0,10),time:String(x.prof.time||"").slice(0,30)}:null;
  return {v:2,goal:[5,10,15].includes(x.goal)?x.goal:10,upd:Number.isFinite(x.upd)?x.upd:0,prof:p,a,m,lc,d,last:okObj(x.last)?{t:String(x.last.t).slice(0,10),u:String(x.last.u||"").slice(0,30)}:null};
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const c=clean(JSON.parse(r));if(c)S=c}}catch(e){storeOk=false}}
function save(){S.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storeOk=false;banner()}cloudPush()}
const addDays=(ts,n)=>{const d=new Date(ts);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n).getTime()};
const sod=ts=>addDays(ts,0),now=()=>Date.now();
const fmt=ts=>new Date(ts).toLocaleDateString(lang==="ru"?"ru-RU":"en-GB",{day:"numeric",month:"short"});
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dueList=()=>Object.keys(S.m).filter(k=>S.m[k].due&&S.m[k].due<=now()&&!S.m[k].done).map(Number);
const att=id=>S.a.filter(t=>t.id===id);
const ans=(q,s)=>q.type==="spr"?String(s):`${"ABCD"[s]}. ${q.o[s]}`;
const num=s=>{s=String(s).replace(/[\s,]/g,"");const f=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(f)return +f[1]/+f[2];return /^-?\d*\.?\d+$/.test(s)?+s:NaN};
const sprOk=(q,s)=>{const v=num(s);return !isNaN(v)&&q.ans.some(a=>Math.abs(num(a)-v)<1e-9)};

/* ---- scheduling ---- */
function record(q,sel,ok,mode){
  const t=now();S.a.push({id:q.id,ts:t,sel,ok,mode,first:!S.a.some(x=>x.id===q.id)});
  let m=S.m[q.id];
  if(!ok){
    m=S.m[q.id]=m||{stage:0,fails:0,note:"",flag:false,due:null,done:false,lastWrong:null};
    m.fails++;m.lastWrong=sel;m.done=false;
    m.stage=mode==="review"?Math.max(0,m.stage-1):0;
    m.due=addDays(t,INT[m.stage]);
  }else if(m&&mode==="review"&&m.due&&m.due<=t){
    m.stage++;
    if(m.stage>=INT.length){m.done=true;m.due=null}else m.due=addDays(t,INT[m.stage]);
  }
  save();
}
function ensureM(id){return S.m[id]=S.m[id]||{stage:0,fails:0,note:"",flag:false,due:null,done:false,lastWrong:null}}

/* ---- stats and recommendation ---- */
function skillStats(){const o={};S.a.forEach(t=>{const q=qid(t.id);if(!q)return;const s=o[q.skill]=o[q.skill]||{n:0,ok:0,unit:q.unitId};s.n++;if(t.ok)s.ok++});return o}
function rec(){
  const due=dueList();
  if(due.length)return{title:T(`Review ${due.length} due question${due.length>1?"s":""}`,`Повторить вопросы: ${due.length}`),why:T("These questions reached their scheduled date (1, 3, 7 or 14 days after your last result). A short review now helps the answer stick.","Эти вопросы дошли до даты повторения (через 1, 3, 7 или 14 дней). Короткое повторение закрепляет ответ."),cta:T("Start review","Начать повторение"),act:"App.review()"};
  const rr=reasonRec();if(rr)return rr;const st=skillStats(),weak=Object.entries(st).filter(([k,s])=>s.n>=3&&s.ok/s.n<.6).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n)[0];
  if(weak){const[k,s]=weak;return{title:T(`Strengthen: ${k}`,`Укрепить навык: ${k}`),why:T(`You missed ${s.n-s.ok} of ${s.n} questions on this skill. Review the lesson, solve three targeted questions, and revisit this skill tomorrow.`,`Вы ошиблись в ${s.n-s.ok} из ${s.n} вопросов по этому навыку. Повторите урок, решите три вопроса и вернитесь к навыку завтра.`),cta:T("Open the lesson","Открыть урок"),act:`App.learn('${s.unit}')`}}
  const few=SK.filter(k=>!st[k]||st[k].n<3);
  if(few.length){const k=few[0],i=SK.indexOf(k);return{title:T(`Gather evidence: ${k}`,`Набрать данные: ${k}`),why:T("You have fewer than 3 attempts on this skill, so we cannot tell yet how it is going.","По этому навыку меньше 3 попыток, поэтому пока рано судить."),cta:T("Try 3 questions","Решить 3 вопроса"),act:`App.prac({sk:${i},n:3,src:'unseen'})`}}
  return{title:T("Keep going with mixed practice","Продолжайте смешанную практику"),why:T("Your recorded skills all have some evidence. Mixed practice keeps them fresh.","По всем навыкам уже есть данные. Смешанная практика поддерживает их."),cta:T("Start practice","Начать практику"),act:"App.prac({n:5,src:'any'})"};
}

/* Smooth Two-Phase Stage Transition */
function show(html, immediate){
  const s=$("#stage");
  const curBox=s.querySelector(".view-transition");
  clearTimeout(_navTimer);
  const inject=()=>{
    s.innerHTML=`<div class="view-transition${(R&&R.fb)||(X&&!X.done&&view==="exam")?" still":""}">${html}</div>`;
    nav();banner();
    if(!R||!R.fb) window.scrollTo({top:0,behavior:"smooth"});
    const h=s.querySelector("h1");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}
  };
  if(curBox && !immediate && !(R && R.fb)){
    curBox.classList.add("stage-leave");
    _navTimer=setTimeout(inject, 145);
  }else{

  }
}

const head=(t,sub,right)=>`<header class="page-header"><div><h1>${t}</h1>${sub?`<p class="text-muted">${sub}</p>`:""}</div>${right||""}</header>`;
const bar=(v,label)=>`<div class="progress-track" role="img" aria-label="${esc(label)}"><div class="progress-fill" style="width:${Math.round(v*100)}%"></div></div>`;
const diffBadge=d=>`<span class="badge ${d==="Hard"?"badge-warn":d==="Easy"?"badge-ok":""}">${d}</span>`;
function modal(html){const r=$("#modal-root");$("#modal-body").innerHTML=html;r.classList.add("open");const f=$("#modal-body").querySelector("input,select,textarea,button");f&&f.focus()}
function closeModal(){$("#modal-root").classList.remove("open")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
$("#modal-root").addEventListener("click",e=>{if(e.target.id==="modal-root")closeModal()});

/* ---- views ---- */
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function daily(){
  const c={},MIN=3;S.a.forEach(x=>{const k=dkey(x.ts);c[k]=(c[k]||0)+1});
  const ok=k=>(c[k]||0)>=MIN;
  const ks=Object.keys(c).filter(ok).map(k=>{const p=k.split("-");return new Date(+p[0],p[1]-1,+p[2]).getTime()}).sort((a,b)=>a-b);
  let best=0,run=0;ks.forEach((v,i)=>{run=i&&addDays(ks[i-1],1)===v?run+1:1;best=Math.max(best,run)});
  let d=sod(now()),streak=0;if(!ok(dkey(d)))d=addDays(d,-1);
  while(ok(dkey(d))){streak++;d=addDays(d,-1)}
  let xp=0;S.a.forEach(x=>{xp+=x.first?(x.ok?10:4):(x.mode==="review"&&x.ok?6:0)});
  return{today:c[dkey(now())]||0,streak,best,xp,MIN,week:[...Array(7)].map((_,i)=>{const s=addDays(now(),i-6);return{s,n:c[dkey(s)]||0}})};
}
function goalHTML(){
  const g=daily(),goal=S.goal||10,left=goal-g.today;
  const msg=left<=0?T("Daily goal reached. Nicely done; anything extra is a bonus.","Цель на день выполнена. Отлично, всё остальное — бонус."):(g.streak===0&&S.a.length>g.today?T("Fresh start today: 3 answered questions begin a new streak.","Новый старт сегодня: 3 вопроса начнут новую серию."):T(`${left} more to reach today's goal.`,`Ещё ${left} до цели на сегодня.`));
  return `<section class="card" aria-labelledby="goal-h" style="margin-bottom:1.6rem"><div class="between"><h2 id="goal-h">${T("Daily goal","Цель на день")}</h2><div class="cluster" role="group" aria-label="${T("Daily goal","Цель на день")}">${[5,10,15].map(n=>`<button class="btn btn-sm ${n===goal?"btn-primary":"btn-secondary"}" aria-pressed="${n===goal}" onclick="App.goal(${n})">${n}</button>`).join("")}</div></div><p>${g.today} / ${goal} ${T("questions today","вопросов сегодня")}</p>${bar(Math.min(1,g.today/goal),g.today+"/"+goal)}<p class="text-muted">${esc(msg)}</p><div class="cluster"><span class="badge badge-accent">${T("Streak","Серия")}: ${g.streak}</span><span class="badge">${T("Best","Рекорд")}: ${g.best}</span><span class="badge badge-ok">XP ${g.xp} · ${T("Level","Уровень")} ${Math.floor(g.xp/100)+1}</span></div><div class="cluster" style="margin-top:.6rem">${g.week.map(d=>`<span class="badge ${d.n>=g.MIN?"badge-ok":""}" title="${fmt(d.s)}: ${d.n}">${fmt(d.s)} · ${d.n}</span>`).join("")}</div><p class="text-xs">${T(`A day counts toward the streak after ${g.MIN} answered questions. XP is awarded for first attempts and correct scheduled reviews, never for repeats.`,`День засчитывается в серию после ${g.MIN} отвеченных вопросов. XP даётся за первые попытки и верные повторения, не за повторы.`)}</p></section>`;
}

function merge(a,b){const k=new Set(),all=[];[...a.a,...b.a].forEach(t=>{const x=t.id+"_"+t.ts;if(!k.has(x)){k.add(x);all.push(t)}});all.sort((p,q)=>p.ts-q.ts);
 const seen=new Set();all.forEach(t=>{t.first=!seen.has(t.id);seen.add(t.id)});
 const last=(s,id)=>Math.max(0,...s.a.filter(t=>t.id===id).map(t=>t.ts)),m={};
 new Set([...Object.keys(a.m),...Object.keys(b.m)]).forEach(id=>{const x=a.m[id],y=b.m[id];m[id]=!x?y:!y?x:(last(a,+id)>=last(b,+id)?x:y)});
 const n=a.upd>=b.upd?a:b;return Object.assign({},n,{a:all,m,lc:Object.assign({},a.lc,b.lc),d:Object.assign({},a.d,b.d),prof:n.prof||a.prof||b.prof,upd:Math.max(a.upd,b.upd)})}
async function cloudAuth(){const u=window.CS&&window.CS.user;cuser=u||null;
 if(!u){sync="off";nav();if(view==="settings"||view==="home")go(view);return}
 try{const raw=await window.CS.load(u);sync="on";const c=raw?clean(JSON.parse(raw)):null;if(c){S=merge(S,c)}save()}catch(e){sync="error"}
 nav();if(["home","path","progress","notebook","review","settings"].includes(view))go(view)}
const acctLabel=()=>cuser?T("Sign out","Выйти")+" ("+esc(cuser.email||cuser.displayName||"")+")":T("Sign in with Google","Войти через Google");
const syncText=()=>cuser?T(`Signed in as ${esc(cuser.email)}. Your progress is also stored in Firebase (Google Cloud) under your account, so it follows you across devices. Only you can read it. A local copy stays in this browser; download a backup anyway.`+(sync==="error"?" The last cloud save failed; your local copy is safe.":""),`Вы вошли как ${esc(cuser.email)}. Прогресс также хранится в Firebase (Google Cloud) в вашем аккаунте и доступен на разных устройствах. Читать его можете только вы. Локальная копия остаётся в браузере; всё равно скачивайте резервную копию.`+(sync==="error"?" Последнее облачное сохранение не удалось; локальная копия цела.":"")):T("Not signed in. Progress is stored only in this browser (localStorage), does not sync between devices and can be lost if you clear browser data. Sign in with Google to keep it in the cloud.","Вы не вошли. Прогресс хранится только в этом браузере (localStorage), не синхронизируется между устройствами и может пропасть при очистке данных. Войдите через Google, чтобы хранить его в облаке.");

const App={go,learn:id=>{view="learn";learn(id)},prac,pick,check,next,quit,demo,closeModal,dl,cp,imp,impFile,resetAsk,openOnboarding,
  note:noteSave,flag,nb:notebook,diagRun,
  start:()=>S.prof?go("diag"):openOnboarding(),
  obSave:()=>{S.prof={goal:$("#ob-g").value,level:$("#ob-l").value,date:$("#ob-d").value,time:$("#ob-t").value};save();closeModal();go("diag")},
  obSkip:()=>{S.prof=S.prof||{goal:"",level:"",date:"",time:""};save();closeModal();go("diag")},
  done:id=>{S.lc[id]?delete S.lc[id]:S.lc[id]=now();save();learn(id)},
  review:()=>{const d=dueList();d.length?session(d.slice(0,5),T("Review","Повторение"),"review"):go("review")},
  reviewGo:()=>{const d=dueList();d.length?session(d.slice(0,5),T("Review","Повторение"),"review"):go("review")},
  saveNote:(id,v)=>{ensureM(id).note=String(v).slice(0,500);save()},
  rm:id=>{delete S.m[id];save();notebook()},
  impOk:()=>{S=window._imp;window._imp=null;save();closeModal();settings(T("Backup imported.","Копия импортирована."))},
  resetOk:()=>{S=blank();save();closeModal();go("home")},
  openFeedback:()=>modal(`<h2 id="modal-title">${T("Beta feedback","Обратная связь")}</h2><p class="text-muted">${T("There is no server behind this app, so nothing is sent automatically. Write your feedback, copy it and send it to whoever shared ClearStep with you.","У приложения нет сервера, поэтому ничего не отправляется автоматически. Напишите отзыв, скопируйте и отправьте тому, кто дал вам ClearStep.")}</p><div class="field"><label for="fb">${T("Your feedback","Ваш отзыв")}</label><textarea class="input" id="fb" rows="5" maxlength="2000"></textarea></div><div class="cluster" style="margin-top:.8rem"><button class="btn btn-primary" onclick="(function(b){var t=document.getElementById('fb');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}b.textContent='${T("Copied!","Скопировано!")}'})(this)">${T("Copy feedback","Скопировать")}</button><button class="btn btn-secondary" onclick="App.closeModal()">${T("Close","Закрыть")}</button></div>`),
  setLang:l=>{lang=l;try{localStorage.setItem("cs2_lang",l)}catch(e){}go(view==="session"||view==="summary"?"home":view)},
  exam:examStart,xgo:k=>{X.i=k;drawX()},xmark:()=>{const id=X.list[X.i];X.mark[id]=!X.mark[id];drawX()},xset:v=>{const id=X.list[X.i];X.ans[id]=v;if(typeof v==="number")drawX()},xfin:()=>{const u=X.list.filter(id=>X.ans[id]==null||X.ans[id]==="").length;if(u&&!confirm(T(`${u} unanswered. Finish anyway?`,`Без ответа: ${u}. Завершить?`)))return;examSubmit()},why:k=>{ensureM(cur().id).why=k;save();const v=$("#note")?$("#note").value:"";drawQ();if($("#note"))$("#note").value=v},acct:()=>{if(!window.CS)return alert(T("Sign-in is unavailable (no connection or blocked). Progress is still saved in this browser.","Вход недоступен (нет соединения или заблокирован). Прогресс всё равно сохраняется в браузере."));if(cuser){if(confirm(T("Sign out? Your progress stays saved in your account and in this browser.","Выйти? Прогресс останется в аккаунте и в этом браузере.")))window.CS.signOut()}else window.CS.signIn().catch(e=>{if(e&&e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")alert(T("Sign-in failed: ","Не удалось войти: ")+(e.code||e.message))})},goal:n=>{S.goal=n;save();go("home")},toggleTheme:()=>{const h=document.documentElement,n=h.dataset.theme==="dark"?"light":"dark";h.classList.add("theme-anim");h.dataset.theme=n;updateThemeIcon();setTimeout(()=>h.classList.remove("theme-anim"),450);try{localStorage.setItem("cs2_theme",n)}catch(e){}}};
window.App=App;
try{const t=localStorage.getItem("cs2_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}
load();go("home");window.addEventListener("cs-auth",cloudAuth);if(window.CS&&window.CS.user)cloudAuth();
})();

const auth=getAuth(app),db=getFirestore(app);
window.CS={user:null,
 signIn:()=>signInWithPopup(auth,new GoogleAuthProvider()),
